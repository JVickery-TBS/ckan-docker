<VirtualHost *:8080>
    ServerName ckan.local
    ServerAlias www.ckan.local
    WSGIScriptAlias / /etc/ckan/ckan.wsgi

    # Pass authorization info on (needed for rest api).
    WSGIPassAuthorization On

    # Deploy as a daemon (avoids conflicts between CKAN instances).
    WSGIDaemonProcess ckan.local display-name=ckan.local processes=2 threads=15

    WSGIProcessGroup ckan.local

    ErrorLog /var/log/apache2/ckan.error.log
    CustomLog /var/log/apache2/ckan.custom.log combined

    <IfModule mod_rpaf.c>
        RPAFenable On
        RPAFsethostname On
        RPAFproxy_ips 127.0.0.1
    </IfModule>

    <Directory />
        Require all granted
    </Directory>

</VirtualHost>
