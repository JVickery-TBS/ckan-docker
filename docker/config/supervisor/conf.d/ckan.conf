[program:ckan-uwsgi]
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=15
stopsignal=QUIT
numprocs=1
process_name=%(program_name)s-%(process_num)02d
command=/bin/bash -c "if [[ -f '/srv/app/ckan/bin/uwsgi' ]]; then \
        /srv/app/ckan/bin/uwsgi \
          --master \
          --workers 1 \
          --threads 1 \
          --log-master \
          --http-socket :5001 \
          --single-interpreter \
          --uid ckan \
          --gid ckan \
          --wsgi-file /srv/app/ckan/wsgi.py \
          --lazy-apps \
          --touch-workers-reload /srv/app/ckan/reload.trigger
          --worker-reload-mercy 1 \
          --stats :1717; \
        fi;"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
redirect_stderr=true

; command=/bin/bash -c "if [[ -f '/srv/app/ckan/bin/ckan' ]]; then \
;         /srv/app/ckan/bin/ckan \
;             -c /srv/app/ckan/ckan.ini \
;             run \
;             --passthrough-errors \
;             --prefix /data \
;             --port 5001 \
;             --host 0.0.0.0; \
;         fi;"
