version: "3"
services:
#
# CKAN
#
  ckan-devm:
    container_name: devm-og-ckan
    image: openknowledge/ckan-dev-devm:2.10
    build:
      context: .
      dockerfile: docker/ckan/Dockerfile
      args:
        USER_ID: ${USER_ID:-0}
        GROUP_ID: ${GROUP_ID:-0}
    healthcheck:
      test: /srv/app/ckan/bin/uwsgi --connect-and-read 127.0.0.1:1717 || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
    working_dir: /srv/app
    networks:
      ckan-core-local-network:
        ipv4_address: 172.25.235.7
    depends_on:
      postgres-devm:
        condition: service_started
      solr-devm:
        condition: service_healthy
      redis-devm:
        condition: service_healthy
    links:
      - postgres-devm
      - solr-devm
    env_file:
      - .docker.env
    environment:
      CONTAINER_ROLE: ckan
      CKAN_ROLE: ckan
      PGHOST: postgres-devm
      PGDATABASE: postgres
      PGUSER: homestead
      PGPASSWORD: secret
      SSH_AUTH_SOCK: /ssh-agent
      NGINX_UNAME: ckan
      APP_ROOT: /srv/app
      PATH: '$PATH:/srv/app/ckan/bin'
      PY_VERSION: 3.14
      PYTHONHTTPSVERIFY: 0
      SSL_VERIFY: 0
      CKAN_INI: /srv/app/ckan/ckan.ini
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - ./docker/config/ckan:/docker-entrypoint.d
      - .:/srv/app
      - ./docker/config/nginx/certs:/usr/share/certs
      - ./docker/config/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/config/ckan/apache:/etc/apache2/sites-available
      - ./docker/config/ckan/apache/ckan.apache2.conf:/etc/apache2/apache2.conf
      - ./docker/config/ckan/apache/ports.conf:/etc/apache2/ports.conf
      - ./docker/config/ckan/wsgi:/etc/ckan/ckan
      - ~/.gitconfig:/etc/gitconfig:ro
      - ~/.ssh/id_ecdsa:/srv/app/.ssh/id_ecdsa:ro
      - ~/.ssh/id_ecdsa.pub:/srv/app/.ssh/id_ecdsa.pub:ro
      - ~/.ssh/id_rsa:/srv/app/.ssh/id_rsa:ro
      - ~/.ssh/id_rsa.pub:/srv/app/.ssh/id_rsa.pub:ro
      - $SSH_AUTH_SOCK:/ssh-agent:ro
    ports:
      - 5009:5001
#
# Postgres
#
  postgres-devm:
    container_name: devm-og-postgres
    image: postgres:13.14
    restart: always
    healthcheck:
      test: pg_isready -U postgres || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      ckan-core-local-network:
        ipv4_address: 172.25.235.9
    volumes:
      - ./postgres:/var/lib/postgresql/data
      - ./docker/config/postgres:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: og_drupal_local__dev
      POSTGRES_USER: homestead
      POSTGRES_PASSWORD: secret
      POSTGRES_HOST_AUTH_METHOD: trust
    env_file:
      - .docker.env
    user: "${USER_ID:-0}:${GROUP_ID:-0}"
    ports:
      - 15439:5432
# END
# Postgres
# END
#
# Solr
#
  solr-devm:
    container_name: devm-og-solr
    image: solr-devm
    restart: always
    build:
      context: .
      dockerfile: docker/solr/Dockerfile
      args:
        USER_ID: ${USER_ID:-0}
        GROUP_ID: ${GROUP_ID:-0}
    healthcheck:
      test: solr status || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
    working_dir: /opt/solr
    networks:
      ckan-core-local-network:
        ipv4_address: 172.25.235.10
    volumes:
      # Custom server stuffs
      - ./solr/_bin:/opt/tbs/bin
      - ./solr/_empty_core:/var/solr/data/_empty_core
      # Custom configsets
      - ./solr/configsets:/var/solr/data/configsets
      # Persisting CKAN Solr Cores
      - ./solr/ckan:/var/solr/data/ckan
      # Persisting CKAN Test Solr Cores
      - ./solr/test__ckan:/var/solr/data/test__ckan
    environment:
      CONTAINER_ROLE: solr
      SOLR_SSL_ENABLED: "false"
      SOLR_USER: solr
      SOLR_GROUP: solr
      ROOT_PASS: Docker!
    user: "${USER_ID:-0}:${GROUP_ID:-0}"
    expose:
      - 8983
    ports:
      - 5008:8983
# END
# Solr
# END
#
# Redis
#
  redis-devm:
    container_name: devm-og-redis
    image: redis
    restart: always
    healthcheck:
      test: redis-cli info server || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
    working_dir: /data
    networks:
      ckan-core-local-network:
        ipv4_address: 172.25.235.11
    volumes:
      - ./docker/config/nginx/certs:/usr/share/certs
      # - ./redis:/data
    environment:
      - CONTAINER_ROLE=redis
      - NGINX_UNAME=root
    user: "root:root"
    expose:
      - 6379
# END
# Redis
# END

volumes:
  postgres:
    driver: "local"
  solr:
    driver: "local"

networks:
  ckan-core-local-network:
    external: false
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.235.0/24
          gateway: 172.25.235.1
